name: staging-validate

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'stitch_nexus_mc_premium_store/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate staging deployment artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Validate compose config (render only)
        shell: bash
        env:
          STAGING_IMAGE_TAG: staging-ci-validation
        run: |
          set -euo pipefail
          mkdir -p deploy/certs
          printf 'placeholder\n' > deploy/certs/origin-ca.pem
          cp deploy/staging.env.example deploy/staging.env
          chmod 600 deploy/staging.env
          docker compose -f compose.staging.yaml config --quiet
          rm -f deploy/staging.env deploy/certs/origin-ca.pem

      - name: Build runtime image (no publish)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.staging
          target: runtime
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha,scope=staging-runtime

      - name: Build migrations image (no publish)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: Dockerfile.staging
          target: migrations
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha,scope=staging-migrate
