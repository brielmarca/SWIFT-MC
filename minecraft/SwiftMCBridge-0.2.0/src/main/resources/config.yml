# A API só fica ativa depois de configurar endpoint HTTPS + token aleatório.
enabled: false
apiUrl: "https://staging.swiftmc.com.br"
apiKey: "TROQUE-POR-UM-TOKEN-ALEATORIO-DE-PELO-MENOS-32-CARACTERES"
serverId: "swift-staging"
endpoints:
  link: "/v1/bridge/link"
  pending: "/v1/bridge/pending"
  acknowledge: "/v1/bridge/ack"
pollSeconds: 30
httpTimeoutSeconds: 12
maxBackoffSeconds: 600
